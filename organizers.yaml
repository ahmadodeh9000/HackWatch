# Census of everyone who runs tech and engineering events in Jordan, and what their site offers a
# polite script. Probed on 2026-11-11 from a home connection (census/probe-home.json) and from a
# GitHub runner (census/probe-runner.json) with scripts/census_probe.py.
#
# class:   api_feed | clean_html | js_endpoint | js_no_endpoint | runner_blocked | blocked |
#          no_listing | social_only | dead        (explained in hackwatch/census.py)
# verdict: covered (a source reads it) | build (worth a source) | candidates (news pages: finds go to
#          the Candidate events issue for a human) | home_fetch (only reachable from home) |
#          manual (add by hand when announced) | outreach (ask them to connect a calendar or use the form) | skip
# reach:   ok | blocked | robots | down | missing, from each place, best of the organizer's pages
# social:  links found on the organizer's own site. They are recorded, never fetched.
