    labels: [Cybersecurity]
  ctf:
    label: CTF
    label_ar: مسابقات CTF
    aliases: [capture-the-flag]
    keywords: [ctf, capture the flag, jeopardy ctf]
  cp:
    label: Competitive programming
    label_ar: البرمجة التنافسية
    aliases: [competitive-programming, icpc]
    keywords: [competitive programming, icpc, acm, codeforces, leetcode, programming contest,
               coding contest, البرمجة التنافسية]
  data:
    label: Data
    label_ar: البيانات
    aliases: [data-science, analytics]
    keywords: [data science, data analytics, data analysis, data engineering, big data, datathon,
