# Controlled vocabulary for event types and tags, plus the keyword rules that
# hackwatch/infer.py uses to guess them from an event's text.
#
# Matching (see infer.py):
# - English keywords are whole words/phrases, case-insensitive, plural "s" allowed
#   ("hack" matches "Hacks" but not "Lifehacks").
# - Arabic keywords match anywhere in a word (so "ورشة" also matches "الورشة").
# - "labels" match a source's own category labels exactly (GDG event tags,
#   Devpost themes), case-insensitive.
# - Values set explicitly by a source or in manual_events.yaml always win.

# Filter chips the website always shows, in this order, even when no current event has
# them (shown as "Robotics (0)", linking to the submission form). Other types and tags
# appear only when events use them, after these, by count. Written to docs/labels.json.
pinned:
  type: [hackathon, competition, workshop, conference, meetup]
  tag: [robotics, ctf, cp, ai, security]

# "Club life" events: real, but mostly interesting to members (inaugurations, officer
# kickoffs, awareness days, internal meetings). They're flagged low_signal and hidden on
# the site unless "Show club life events" is on; they stay in events.json. Matched
# against the title only. A manual entry can set low_signal: true/false explicitly.
low_signal:
  keywords: [inauguration, inaugural ceremony, officers, officer, kickoff, kick-off, opening ceremony,
             opening event, launch ceremony, awareness, report, internal meeting, general assembly,
             elections, board meeting, team building, orientation day, welcome day, recruitment,
             حفل افتتاح, افتتاح, تدشين, اجتماع داخلي, الهيئة العامة, انتخابات, توعية, توعوي, تقرير,
             حفل تكريم, يوم تعريفي]

# Type rules are checked in order and the first match wins. Each field is tried
# separately: title first, then the source's labels, then the description.
# So "Reclaim hackathon information session" is a meetup (first rule), and a
# description that merely mentions a hackathon can't override a title that says "Workshop".
types:
  - type: meetup  # sessions *about* another event come first
    keywords: [info session, information session, orientation, open day, open house]
  - type: hackathon
    keywords: [hackathon, hack, hack day, hack night, datathon, ideathon, buildathon, makeathon,
               designathon, codefest, game jam, هاكاثون, هكاثون]
  - type: competition
    keywords: [competition, contest, challenge, cup, olympiad, championship, tournament, ctf,
               capture the flag, treasure hunt, finals, national final, grand final, final round,
               qualifier, quals,
               wro, world robot olympiad, first lego league, fll, robocup, micromouse,
               مسابقة, تحدي, بطولة, أولمبياد, اولمبياد, سباق, نهائيات, تصفيات]
  - type: conference
    keywords: [conference, summit, forum, devfest, expo, exhibition, symposium, congress, convention,
               مؤتمر, قمة, ملتقى, منتدى, معرض]
    labels: [Conference]
  - type: workshop
    keywords: [workshop, bootcamp, boot camp, training, hands-on, course, masterclass, tutorial,
               study jam, ورشة, ورشه, دورة, تدريب, معسكر]
    labels: [Workshop / hands-on session]
  - type: meetup
    keywords: [meetup, meet-up, meeting, talk, webinar, networking, lecture, session, panel, fireside chat,
               lightning talk, ieee day, celebration, ceremony, inauguration, kickoff, kick-off,
               opening event, launch event, لقاء, محاضرة, ندوة, جلسة, أمسية, امسية, احتفال, حفل]
    labels: [Networking]

# Tags: every rule that matches title, labels or description adds its tag.
# Only these tag ids are allowed on events. Aliases are other accepted spellings
# when a tag is set by hand (e.g. "cybersecurity" -> security).
tags:
  ai:
    label: AI & ML
    label_ar: الذكاء الاصطناعي
    aliases: [ml, machine-learning, artificial-intelligence, genai]
    keywords: [ai, a.i., artificial intelligence, machine learning, deep learning, llm, genai,
               generative ai, agentic, computer vision, nlp, ذكاء اصطناعي, الذكاء الاصطناعي, تعلم الآلة]
    labels: [Machine Learning/AI]
  web:
    label: Web
    label_ar: الويب
    aliases: [web-dev, frontend, backend]
    keywords: [web, web development, frontend, front-end, backend, back-end, full stack, full-stack,
               javascript, react, html, css, تطوير المواقع, الويب]
    labels: [Web]
  mobile:
    label: Mobile
    label_ar: تطبيقات الجوال
    aliases: [android, ios, flutter]
    keywords: [mobile, android, ios, flutter, react native, kotlin, swift, app development, تطبيقات الموبايل, الهواتف]
    labels: [Mobile]
  cloud:
    label: Cloud & DevOps
    label_ar: السحابة وDevOps
    aliases: [devops]
    keywords: [cloud, aws, azure, gcp, google cloud, devops, ci/cd, kubernetes, docker, serverless, الحوسبة السحابية]
    labels: [DevOps, Serverless, Google Cloud]
  security:
    label: Security
    label_ar: الأمن السيبراني
