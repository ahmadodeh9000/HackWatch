name: PR check

# Runs on pull requests opened by people. The bot's event/* PRs are skipped: submission.yml has
# already validated them and sets the "hackwatch/validate" commit status instead. A pull_request
# trigger has no filter for the head branch, so the condition is on the job. A fork's branch
# called event/* still gets the full check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !(startsWith(github.head_ref, 'event/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate manual_events.yaml
        run: python -m hackwatch.cli validate

      - name: Validate sources.yaml
        run: python -c "from hackwatch.scrapers import get_available_scrapers; print(len(get_available_scrapers(include_disabled=True)), 'sources OK')"

      - name: Run tests (offline, recorded fixtures)
        run: python -m pytest -q
