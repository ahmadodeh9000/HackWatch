name: Update HackWatch Events & Deploy

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        # Use this when the event count is *expected* to drop a lot, e.g. after
        # removing a source or tightening a filter. It only skips the "less than
        # half of the live count" check; an export with zero events still fails.
        description: "Deploy even if the export has less than half the live event count"
        type: boolean
        default: false
  # Every push deploys: the site (docs/), sources and taxonomy all live in this repo.
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read
  issues: write   # "Source down: <name>" issues (hackwatch health)

# Runs queue instead of cancelling each other: on 2026-10-28 the late-started daily run
# cancelled a push run that had just deployed. A cancelled run could also stop mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # For digest.png: Pillow lays out Arabic (joined letters, right to left) only when
      # libraqm and FriBiDi are present, and needs fonts with Arabic glyphs.
      - name: Install Arabic text layout and fonts
        run: sudo apt-get install -y --no-install-recommends libraqm0 libfribidi0 fonts-noto-core fonts-dejavu-core

      - name: Check Arabic layout is available
        run: python -c "from PIL import features; import sys; ok = features.check('raqm'); print('raqm:', ok); sys.exit(0 if ok else 1)"
        continue-on-error: true

      - name: Run tests (offline, recorded fixtures)
        run: python -m pytest -q

      - name: Fetch events (scraper failures are non-fatal)
        # Prints a per-source table (HTTP codes, timings, errors) to the log and the job
        # summary, and publishes it as status.json so it's readable without signing in.
        run: python -m hackwatch.cli fetch --report docs/status.json || true

      # Adds zero_streak to status.json; opens/updates a "Source down: <name>" issue after
      # 2 empty runs in a row and closes it when the source recovers. Never blocks the deploy.
      - name: Track source health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m hackwatch.cli health --status docs/status.json

      # Per-source guard: a source that had >= 3 events in the live site but returned
      # nothing now (error, block, empty page) keeps those events, marked stale, with a
      # warning in the job summary.
      - name: Keep last deployed events of sources that returned nothing
        run: python -m hackwatch.cli carry-over --previous https://ahmadodeh9000.github.io/HackWatch/events.json

      - name: Export events (events.json, labels.json, events.ics, digest, share pages)
        run: >
          python -m hackwatch.cli export --out docs/events.json --labels docs/labels.json
          --ics docs/events.ics --digest docs/digest.txt --digest-png docs/digest.png --pages docs/e

      # Fails on 0 events, or on fewer than half the deployed count. A manual run
      # with force=true sets the ratio to 0, which disables only the second check.
      # (inputs.force is empty on scheduled/push runs, so they always use 0.5.)
      - name: Refuse to deploy an empty or shrunken export
        run: >
          python scripts/check_export.py docs/events.json
          --previous https://ahmadodeh9000.github.io/HackWatch/events.json
          --min-ratio ${{ inputs.force && '0' || '0.5' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # A "successful" deploy once served an empty site (Pages was publishing the raw
      # docs/ folder from the branch). Check what visitors actually get.
      - name: Check the live site serves events.json and events.ics
        run: python scripts/check_live.py "${{ steps.deploy.outputs.page_url }}"
