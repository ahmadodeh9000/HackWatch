name: Update HackWatch Events & Deploy

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        # Use this when the event count is *expected* to drop a lot, e.g. after
        # removing a source or tightening a filter. It only skips the "less than
        # half of the live count" check; an export with zero events still fails.
        description: "Deploy even if the export has less than half the live event count"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - manual_events.yaml

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (offline, recorded fixtures)
        run: python -m pytest -q

      - name: Fetch events (scraper failures are non-fatal)
        run: python -m hackwatch.cli fetch || true

      - name: Export events to docs/events.json
        run: python -m hackwatch.cli export --out docs/events.json --labels docs/labels.json

      # Fails on 0 events, or on fewer than half the deployed count. A manual run
      # with force=true sets the ratio to 0, which disables only the second check.
      # (inputs.force is empty on scheduled/push runs, so they always use 0.5.)
      - name: Refuse to deploy an empty or shrunken export
        run: >
          python scripts/check_export.py docs/events.json
          --previous https://ahmadodeh9000.github.io/HackWatch/events.json
          --min-ratio ${{ inputs.force && '0' || '0.5' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
