name: Probe candidate sources

# Fetches candidate event sources from a GitHub runner (some sites block datacenter
# IPs; Eventbrite does) and posts the results on the "Runner probe" issue.
# Runs when the candidate list changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_sources.py

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/probe_sources.py
