# Event sources. Each entry:
#   name          unique id, shown as the event's "source"
#   scraper       which scraper class to use (defaults to name); see hackwatch/scrapers/registry.py
#   enabled       false skips it in `fetch`
#   scope         jordan | worldwide (an event can override it)
#   default_type  used when neither the event nor inference sets a type
#   default_tags  added to every event from this source
#   allowed_types limits which types inference may pick for this source
#   require_tech_keywords  true = keep only events with a tech keyword (general listings)
#   infer_tags    false = don't guess tags from the text (default true)
#   may_be_empty  true = 0 events is normal; no "Source down" issue (default false)
#   options       passed to the scraper's constructor (names must match its arguments)
#
# Status, numbers and failed sources: see SOURCES.md.
sources:
  - name: devpost
    enabled: true
    scope: worldwide
    default_type: hackathon
    # Devpost only lists hackathons and competitions, so "Syntax Summit" there is
    # still a hackathon, while "OpenCV AI Competition" is a competition.
    allowed_types: [hackathon, competition]
    options:
      max_pages: 2

  - name: eventbrite
    enabled: true
    scope: jordan
    require_tech_keywords: true   # lists everything, incl. parties and sales meetings
    options:
      # Jordan only: online Eventbrite searches were mostly generic webinars.
      # As of 2026-10 Eventbrite returns the same ~10 Jordan events for any term.
      places: [jordan]
      search_terms: [hackathon, tech, ai, programming, robotics, cybersecurity, data-science, developer]

  - name: gdg
    scraper: bevy
    enabled: true
    scope: jordan
    default_tags: [gdg]
    options:
      # Public chapter pages (gdg.community.dev/<slug>/) and event pages; the /api/ path
      # is disallowed in robots.txt. Irbid and Zarqa have no city chapters; the JUST
      # Irbid campus chapter was removed (404).
      base_url: https://gdg.community.dev
      chapters:
        - gdg-amman
        - gdg-on-campus-princess-sumaya-university-for-technology-amman-jordan
        - gdg-on-campus-zarqa-university-zarqa-jordan
        - gdg-on-campus-hashemite-university-zarqa-jordan
        - gdg-on-campus-al-hussein-technical-university-amman-jordan
        - gdg-on-campus-al-zaytoonah-university-of-jordan-amman-jordan
        - gdg-on-campus-applied-science-private-university-amman-jordan
        - gdg-on-campus-al-balqa-applied-university-salt-jordan

  - name: startupgrind
    scraper: bevy
    enabled: true
    scope: jordan
    default_tags: [startup]
    options:
      base_url: https://www.startupgrind.com
      chapters: [amman]   # Startup Grind Amman
      organizer: "Startup Grind {chapter}"   # the chapter page is titled just "Amman"

  - name: josa
    enabled: true
    scope: jordan
    default_tags: [josa, open-source]
    options:
      events_url: https://josa.ngo/events

  - name: gju
    enabled: true
    scope: jordan
    # A university calendar: orientation days and ceremonies too, so keep tech ones only.
    require_tech_keywords: true
    options:
      months_ahead: 2   # this month + 2 (3 requests, 10 s apart per robots.txt)

  - name: ieee
    scraper: vtools
    enabled: true
    scope: jordan
    default_tags: [ieee]
    options:
      # The public vTools API can't filter by section, so all upcoming events are
      # paged through (~10 pages of 100) and those hosted by these sections kept.
      section_spoids: [R80079]   # IEEE Jordan Section
      days_ahead: 60
      # robots.txt asks for Crawl-delay: 60. Pages of 200 (~23 s each) halve the request
      # count; ~5 pages a day, ~7 minutes in total.
      page_size: 200
      delay_seconds: 60

  - name: ctftime
    enabled: true
    scope: worldwide
    default_type: competition
    allowed_types: [competition]
    default_tags: [ctf, security]
    infer_tags: false   # descriptions list challenge categories (web, crypto, hardware...)
    options:
      days_ahead: 60   # on-site CTFs outside Jordan are dropped by the usual filter

  - name: codeforces
    enabled: true
    scope: worldwide
    default_type: competition
    allowed_types: [competition]
    default_tags: [cp]
    infer_tags: false
    options:
      days_ahead: 30
      # Regular rated rounds only; remove to include every contest.
      include: ['\bDiv\. ?[123]\b', '^Educational Codeforces Round']

  - name: manual
    enabled: true
    scope: jordan
    may_be_empty: true   # an empty manual_events.yaml is fine
    options:
      yaml_path: manual_events.yaml
