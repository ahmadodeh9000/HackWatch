We are glad to announce the launch of the Climate Change Hackathon 2022!

Calling out for all innovators, entrepreneurs, youth, Tech Geeks, and Organizations to apply and participate to work together to find innovative solutions to Climate change challenges that are faced by Jordan and the whole world in the fields of (Agriculture, Energy, Water, and Solid Waste) by using advanced technologies such as Digital Manufacturing and Artificial Intelligence.

Several distinctive solutions and ideas will be selected by judges at the end of the hackathon, and receive financial and logistical support provided by Zain Innovation Campus to implement these ideas.

The hackathon will start on Thursday, 21/7/2022 until Saturday, 30/7/2022.

The last date for registration is 20/7/2022

بالشراكة مع وزارة البيئة و  برنامج الأمم المتحدة الإنمائي و برنامج الأغذية العالمي؛ نعلن عن إطلاق هاكاثون التغير المناخي 2022!

وندعو الشباب والشركات الناشئة والمؤسسات وخبراء التكنولوجيا للتقديم والمشاركة معنا لنعمل سوياً على إيجاد حلول مبتكرة للتحديات البيئية التي تواجه الأردن والعالم في مجالات (الزراعة، والطاقة، والمياه، والنفايات الصلبة) من خلال استخدام التكنولوجيا الحديثة والمتطورة كالتصنيع الرقمي والذكاء الاصطناعي.

سيتم اختيار عدد من الحلول والأفكار المميزة من قِبل لجنة تحكيم مختصة في نهاية الهاكاثون وستحصل على دعم مادي ولوجستي مقدم من منصّة زين للإبداع  لتطبيق هذه الأفكار على أرض الواقع.

ستبدأ فعاليات الهاكاثون يوم الخميس الموافق 21/7/2022 في تمام الساعة 5:00 مساءً وستستمر حتى مساء يوم السبت الموافق 30/7/2022.

آخر موعد للتسجيل 20/7/2022
