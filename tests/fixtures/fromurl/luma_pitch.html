 networking. Meet 9 founders 1-on-1, so you walk in that evening already knowing faces. This is also where the 10 pitchers are picked.\n\n🍹 Evening, in person: 7:00 PM to 11:30 PM\nFind your morning matches, watch the 10 pitches live, cast your votes and meet the room. The goal: partners, collaborators and warm investor intros.\n\n\n✅ Your ticket includes\nEvening in-person meetup\nMorning virtual speed networking (9 founders, 1-on-1)\nA chance to pitch live on stage\nA vote on who earns the Residency\nFounders-only WhatsApp group\nWelcome drink and popcorn\n\n👥 Who's in the room\nThis month's room already includes founders building in AI, fintech, proptech, cybersecurity and Web3, plus the investors and operators around them.\nPitching is for tech startups. The room is for anyone building one.\n\n🌟 Guest of the Month\nMeet the investor behind Oraseya Capital, in person.\nElliott is Head of Programs at Oraseya Capital, the UAE's #1 most active investor. Listen to the podcast first:\n\nAED 1 Billion government-backed VC fund\n70+ startups backed, from pre-seed to Series B\nUAE's #1 most active investor, 2.5 years running\nRuns Sandbox, their pre-seed and seed programme\nElliott knows exactly what a VC looks for before saying yes. This is your chance to meet him, ask about the fundraising process, and get insights on how to pitch an investor.\nDon't miss the chance to connect in person.\n\n🎟️ Book your seat\nEarly: AED 147\nRegular: AED 167\nSame Day: AED 187 (opens at midnight on event day)\nBook now and save. Seats are limited.\nPlans change? Full refund up to 72 hours before the event.\n👉 Tap Get Ticket above.\n👔 Dress Code: Smart casual. \n🚗 Parking: Free hotel valet parking - please validate your ticket.\n\n💔 Can't make it?\nYour share could connect two people who truly need it.\n\n🔷 FAQ\nDo I have to pitch?\nNo. Pitching is opt-in and for tech startups only. Come to watch, vote and meet the room.\nDo I need to join the morning session?\nNo, the evening works on
